[package]
name = "rawprint"
version = "0.1.0"
edition = "2021"
description = "Windows spooler raw-print helper for SpicyHome POS"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_System_Threading"] }
