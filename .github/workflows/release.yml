name: Release SpicyHome POS

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not commit, tag, or create release)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Build and release Windows 7 package + Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      next_version: ${{ steps.bump.outputs.next_version }}
    env:
      TZ: Asia/Riyadh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Bazel
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-release-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-release-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Bump version
        id: bump
        run: |
          NEXT_VERSION=$(bash scripts/bump-version.sh date)
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      # Fails the release fast when distribution signing secrets are missing —
      # a debug-signed APK would force an uninstall on every tablet.
      - name: Require Android distribution signing secrets
        run: |
          set -euo pipefail
          MISSING=""
          for SECRET_NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!SECRET_NAME:-}" ]; then
              MISSING="$MISSING $SECRET_NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub secrets:$MISSING. Configure them in Settings > Secrets and variables > Actions (see docs/android/apk-signing.md)."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Run tests
        run: |
          bazel test //apps/server:test \
            //apps/pos:test \
            //packages/shared:test \
            //packages/db:test \
            //packages/client-ts:test \
            //packages/client-kt:test \
            //apps/android:unit_tests \
            --test_output=errors \
            --action_env=ANDROID_HOME=$ANDROID_HOME \
            --action_env=JAVA_HOME=$JAVA_HOME

      - name: Decode distribution keystore
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spicyhome-upload.jks"
          ls -lh "$RUNNER_TEMP/spicyhome-upload.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android APK
        run: |
          bazel build //apps/android:apk \
            --action_env=ANDROID_HOME \
            --action_env=JAVA_HOME \
            --action_env=SENTRY_DSN \
            --action_env=SENTRY_ENVIRONMENT \
            --action_env=ANDROID_KEYSTORE_PATH \
            --action_env=ANDROID_KEYSTORE_PASSWORD \
            --action_env=ANDROID_KEY_ALIAS \
            --action_env=ANDROID_KEY_PASSWORD
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_ANDROID_DSN || '' }}
          SENTRY_ENVIRONMENT: production
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/spicyhome-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Refuse to ship an APK whose versionCode/versionName drifted from the
      # bumped VERSION or that is signed with the ephemeral debug key.
      - name: Verify APK versionCode, versionName and signer
        run: |
          set -euo pipefail
          APK="$PWD/bazel-bin/apps/android/spicyhome-pos-debug.apk"
          EXPECTED_VERSION="${{ steps.bump.outputs.next_version }}"
          # YYYYMM * 10000 + DD * 100 + min(N, 99) — same formula as
          # computeVersionCode in app/build.gradle.kts and
          # AppVersion.toVersionCode() in the Android app.
          IFS='.' read -r YM DD N <<< "$EXPECTED_VERSION"
          N=$((10#$N > 99 ? 99 : 10#$N))
          EXPECTED_CODE=$((10#$YM * 10000 + 10#$DD * 100 + 10#$N))
          echo "Expected: versionName=$EXPECTED_VERSION versionCode=$EXPECTED_CODE"

          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found under ANDROID_HOME/build-tools; cannot verify APK"
            exit 1
          fi
          BADGING="$("$AAPT2" dump badging "$APK")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | grep -o "versionCode='[0-9]*'" | head -1 | cut -d"'" -f2)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | grep -o "versionName='[^']*'" | head -1 | cut -d"'" -f2)"
          echo "APK: versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not parse badging output for $APK"
            exit 1
          fi
          if [ "$VERSION_NAME" != "$EXPECTED_VERSION" ]; then
            echo "::error::APK versionName '$VERSION_NAME' does not match expected '$EXPECTED_VERSION'"
            exit 1
          fi
          if [ "$VERSION_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::APK versionCode '$VERSION_CODE' does not match expected '$EXPECTED_CODE'"
            exit 1
          fi

          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ANDROID_HOME/build-tools; cannot verify signer"
            exit 1
          fi
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"
          if printf '%s\n' "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the Android Debug key — refusing to release a debug-signed APK"
            exit 1
          fi
          echo "OK: APK versionCode/versionName match the bump and signer is the distribution certificate."

      - name: Build package
        run: pnpm package:win7
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_POS_DSN || '' }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: spicyhome-pos@${{ steps.bump.outputs.next_version }}
          VITE_APP_VERSION: ${{ steps.bump.outputs.next_version }}
          SENTRY_DSN: ${{ secrets.SENTRY_SERVER_DSN || '' }}
          SENTRY_ENVIRONMENT: production
          SENTRY_TRACES_SAMPLE_RATE: '1.0'
          SENTRY_PROFILES_SAMPLE_RATE: '1.0'

      - name: Packaging smoke test
        run: pnpm package:smoke

      - name: Stage release assets
        run: |
          mkdir -p release
          cp dist/spicyhome-pos-win7.zip "release/spicyhome-pos-win7-v${{ steps.bump.outputs.next_version }}.zip"
          cp bazel-bin/apps/android/spicyhome-pos-debug.apk "release/spicyhome-pos-android-v${{ steps.bump.outputs.next_version }}.apk"

      # Master ruleset requires PRs; GitHub Actions cannot bypass on personal repos.
      # Open a release branch PR, squash-merge, then tag the merge commit.
      - name: Commit version bump via PR, tag, and push tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.next_version }}"
          BRANCH="release/v${VERSION}"
          TITLE="chore(release): bump version to ${VERSION}"

          git checkout -B "$BRANCH"

          git add \
            VERSION \
            MODULE.bazel \
            apps/server/package.json \
            apps/pos/package.json \
            packages/shared/package.json \
            packages/db/package.json \
            packages/api-spec/package.json \
            packages/client-ts/package.json \
            packages/client-kt/package.json

          git commit -m "$TITLE"
          git push -u origin "$BRANCH" --force-with-lease

          # gh pr create --json is not supported on all runner images.
          # Capture the URL and parse the trailing number instead.
          if ! PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated version bump from the Release SpicyHome POS workflow.

          This PR is squash-merged by the same workflow so the version bump
          respects the master branch ruleset (PR required). The release tag
          and GitHub Release are created after merge." 2>/dev/null); then
            # A PR may already exist for this branch (re-run after partial failure).
            PR_URL=$(gh pr view "$BRANCH" --json url --jq .url)
          fi
          PR_NUMBER="${PR_URL##*/}"

          echo "Created PR #${PR_NUMBER} (${PR_URL})"

          # Ruleset allows squash only, 0 required reviews.
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --subject "$TITLE" \
            --body ""

          MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq .mergeCommit.oid)
          if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then
            echo "::error::PR #${PR_NUMBER} merged but mergeCommit SHA is empty"
            exit 1
          fi
          echo "Merge commit: ${MERGE_SHA}"

          git fetch origin master
          git tag -a "v${VERSION}" "$MERGE_SHA" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.next_version }}
          name: SpicyHome POS v${{ steps.bump.outputs.next_version }}
          files: |
            release/spicyhome-pos-win7-v${{ steps.bump.outputs.next_version }}.zip
            release/spicyhome-pos-android-v${{ steps.bump.outputs.next_version }}.apk
          generate_release_notes: true

      # Wipe the decoded keystore from the runner even on failure.
      - name: Wipe distribution keystore from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/spicyhome-upload.jks"

  # Reusable-workflow caller jobs cannot use continue-on-error (GitHub schema).
  # Sentry failures mark the workflow red after the product release job has
  # already committed, tagged, and published assets — release is still done.
  sentry-release:
    name: Sentry releases + source maps
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/sentry-release.yml
    with:
      version: ${{ needs.release.outputs.next_version }}
      dry_run: false
    secrets: inherit
